[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-financial-report-qa-agent"
version = "0.1.0"
description = "基于企业财务报告的检索增强问答 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"chromadb",
	"FlagEmbedding",
	"langchain-chroma",
	"langchain-community",
	"langchain-core",
	"langchain-deepseek",
	"langchain-text-splitters",
	"langgraph",
	"pydantic>=2",
	"PyMuPDF",
	"python-dotenv",
]

[project.scripts]
financial-report-qa = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
